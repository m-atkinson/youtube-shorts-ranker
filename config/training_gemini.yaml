data:
  train_split: 0.85
  val_split: 0.0
  test_split: 0.15
  target_transform: "log1p"  # Apply log1p to view counts

embedding:
  model_name: "models/text-embedding-004"  # Gemini Embeddings (768-dim)
  cache_dir: "data/processed/embeddings"
  batch_size: 32

model:
  type: "ridge"  # Options: linear, ridge, lasso, xgboost, lightgbm
  hyperparameters:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8

training:
  early_stopping_rounds: 10

experiment:
  name: "shorts-predictor-gemini"
  tags:
    project: "youtube-shorts"
    version: "v1"
    embedding: "gemini"
