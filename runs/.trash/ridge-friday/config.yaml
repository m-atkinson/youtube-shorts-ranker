data:
  train_split: 0.85
  val_split: 0.0
  test_split: 0.15
  target_transform: log1p
embedding:
  model_name: all-mpnet-base-v2
  cache_dir: data/processed/embeddings
  batch_size: 32
model:
  type: ridge
  hyperparameters:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
training:
  early_stopping_rounds: 10
experiment:
  name: shorts-predictor
  tags:
    project: youtube-shorts
    version: v1
